name: Pylint

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        # The starter shipped a 3.8/3.9/3.10 matrix, but this repo's code
        # requires 3.11+ (runtime `dict[...]` annotations), so those versions
        # reported syntax errors rather than lint findings. Pin what we run.
        python-version: "3.12"
    - name: Install pylint
      run: |
        python -m pip install --upgrade pip
        pip install pylint
    - name: Analysing the code with pylint
      run: |
        # .pylintrc is a documented BASELINE gate (see the file): every message
        # is printed, and the score may not fall below the recorded baseline.
        pylint --rcfile=.pylintrc $(git ls-files '*.py')
